# Satu-satunya file dependency & konfigurasi tool (aturan "one-version", Sesi 16).
# Mengubah dependency = PR yang di-review M1 + DevOps (CODEOWNERS).

[project]
name = "jalanku"
version = "0.1.0"
description = "Lapor jalan rusak di DKI Jakarta dengan foto, diverifikasi AI + Admin"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Tim JalanKu (COMP6100001, BINUS University)" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
]

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.12,<0.1",
  "pillow>=11,<14",          # validasi & encode ulang foto, buang EXIF (laporan)
  "shapely>=2.0,<3",         # titik di dalam poligon kecamatan (wilayah)
  "numpy>=1.26,<3",          # classifier & kemiripan (ai)
  "onnxruntime>=1.18,<2",    # backbone EfficientNet-B0 (ai)
  "argon2-cffi>=23,<26",     # hash password (akun)
]

[project.urls]
Repository = "https://github.com/nichodarren/jalanku"
Issues = "https://github.com/nichodarren/jalanku/issues"
Changelog = "https://github.com/nichodarren/jalanku/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jalanku*"]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.json", "*.geojson", "*.html", "*.js", "*.css", "*.png", "*.svg", "*.webmanifest", "*.onnx", "*.npy", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "jalanku"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
  "lambat: test yang butuh model AI asli atau data besar",
  "sistem: test sistem lewat browser (Playwright)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["jalanku/web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]  # assert boleh di test; Depends() di default argumen adalah idiom FastAPI

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"tests/**" = ["S", "B"]
