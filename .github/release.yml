# Categories for GitHub's auto-generated release notes (based on PR labels).
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: "✨ Features"
      labels: ["jenis:story", "enhancement"]
    - title: "🐛 Fixes"
      labels: ["jenis:bug", "bug"]
    - title: "🔒 Security"
      labels: ["security"]
    - title: "🧰 Maintenance & CI"
      labels: ["jenis:teknis", "dependencies", "ci"]
    - title: "📝 Other changes"
      labels: ["*"]
