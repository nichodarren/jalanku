# Optional local hooks (same checks as CI, run before each commit):
#   pip install pre-commit && pre-commit install && pre-commit install --hook-type commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=25000"]   # model ONNX ±16 MB boleh; dataset tidak
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^app/
      - id: ruff-format
        files: ^app/
  - repo: local
    hooks:
      - id: tanpa-trailer-ai
        name: commit message tanpa Co-Authored-By asisten AI
        language: pygrep
        entry: '(?i)co-authored-by:.*(claude|copilot|chatgpt|gemini|anthropic|openai)'
        stages: [commit-msg]
